name: Daily Backup (Supabase to Google Sheets)

on:
  schedule:
    # 19:00 UTC = 02:00 WIB (Asia/Jakarta)
    - cron: '0 19 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub

jobs:
  backup:
    name: Sync Supabase to Google Sheets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js

      - name: Execute Backup Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://qgzxrtnelfwlhqisgjcq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_zPwkOk-2BZUGiVY1BpJ5Eg__jfCPLh0' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_GAS_API_URL: ${{ secrets.NEXT_PUBLIC_GAS_API_URL || 'https://script.google.com/macros/s/AKfycbwhy6jhKdsCJSOrDzVO1Av1NXwK1mgJ5u-_7PsefOihNwhsSnTO1C26RfRHrvqHDyWEMA/exec' }}
        run: node scripts/backup-supabase-to-sheets.mjs
