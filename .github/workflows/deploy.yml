name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --prefer-offline
        working-directory: next-app

      - name: Test DB connectivity
        run: |
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/aws-0-ap-northeast-1.pooler.supabase.com/5432' && echo "PORT 5432 OPEN" || echo "PORT 5432 BLOCKED"
        working-directory: next-app

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: next-app
        continue-on-error: true
        timeout-minutes: 3
        env:
          DATABASE_URL: postgresql://postgres.qgzxrtnelfwlhqisgjcq:${{ secrets.DB_PASSWORD }}@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: next-app
        env:
          DATABASE_URL: postgresql://postgres.qgzxrtnelfwlhqisgjcq:${{ secrets.DB_PASSWORD }}@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres

      - name: Build static export
        run: npm run build
        working-directory: next-app
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Copy public assets to out
        run: cp -r public/. out/
        working-directory: next-app

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: next-app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
